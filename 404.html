@font-face{font-family:"Archivo";src:url("/assets/fonts/archivo-var.woff2") format("woff2");font-weight:400 800;font-stretch:100% 125%;font-display:swap}
@font-face{font-family:"Plex Mono";src:url("/assets/fonts/plex-mono-500.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--bg:#F4F6F3;--ink:#14201A;--muted:#56655D;--rule:#D6DDD8;--accent:#0B6B4F;--accent-ink:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1411;--ink:#E3EAE6;--muted:#9AAAA2;--rule:#27332D;--accent:#62C89F;--accent-ink:#06140E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1411;--ink:#E3EAE6;--muted:#9AAAA2;--rule:#27332D;--accent:#62C89F;--accent-ink:#06140E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Archivo","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding-block:48px;padding-inline:clamp(18px,4vw,40px)}
main{max-width:34rem}
p.code{font:500 .8125rem/1.4 "Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-weight:800;font-stretch:118%;font-size:clamp(2rem,1.4rem + 3vw,3rem);line-height:1.05;letter-spacing:-.02em;margin:14px 0 12px}
p{margin:0 0 24px;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>

<main>
